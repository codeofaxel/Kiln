version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/kiln"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # httpx2 pins httpcore2 to an EXACT version (httpx2 2.10.0 requires
      # httpcore2==2.10.0), so neither can move alone: #133 raised httpx2
      # against a lock still holding httpcore2 2.9.1, #128 raised httpcore2
      # against an httpx2 still demanding 2.9.1, and both died in dependency
      # resolution before a test ran. Two PRs, each blocked by the other.
      #
      # Same coupling as the pydantic-core note below, opposite remedy: both
      # of these are direct entries in requirements-lock.txt and both SHOULD
      # move, so they are grouped into one PR rather than ignored.
      http2-stack:
        patterns:
          - "httpx2"
          - "httpcore2"
      # Routine lockfile movement, batched into one PR and one CI run. Listed
      # after http2-stack so that coupled pair still gets its own PR: a
      # dependency joins the first group whose patterns match it.
      #
      # Majors are deliberately excluded and keep arriving one per PR. A major
      # is the bump that needs to be read on its own -- trimesh 4 -> 5 (#125)
      # dropped two Python versions and changed two behaviours; that does not
      # belong in a batch whose whole premise is "these are boring".
      lockfile-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # pydantic-core is not ours to move. It is a transitive dependency that
      # pydantic pins to an EXACT version (pydantic 2.13.4 requires
      # pydantic-core==2.46.4), so a lone bump of it in requirements-lock.txt
      # can never install — every test job fails at dependency resolution
      # before a single test runs. Dependabot reopened that unmergeable PR
      # weekly (#91 was the last one).
      #
      # It moves correctly on its own: when pydantic releases a version that
      # wants a newer core, the pydantic bump carries it along.
      #
      # Scoped to version-update types on purpose — security updates use a
      # separate path, so a real pydantic-core advisory should still surface.
      # (GitHub's docs are explicit about this for `allow` and silent about
      # the same interaction on `ignore`, so treat it as likely-but-unproven
      # rather than guaranteed.)
      - dependency-name: "pydantic-core"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "pip"
    directory: "/octoprint-cli"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      lockfile-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
