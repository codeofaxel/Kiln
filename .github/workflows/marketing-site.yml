name: Marketing site

# Build the kiln3d.com Astro site on every PR that touches docs/site/
# (and on every push to main).  The build itself is the smoke test —
# Astro's strict TS + integration plugins catch most regressions at
# compile.  After build, scan the static output for known secret
# token shapes; fail the workflow if anything resembling a Meta CAPI
# token, GitHub PAT, AWS key, etc. has been baked into the bundle.
#
# This is the backstop for the worst-case mistake of writing
# `import.meta.env.PUBLIC_META_CAPI_TOKEN` (or similar) in an
# Astro file — `PUBLIC_*` env vars get baked into the static JS at
# build time and shipped to every browser.  Pre-commit hooks catch
# most flavors of this in source; the build-output scan catches
# anything that synthesizes a secret-shaped string at build time.

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.github/workflows/marketing-site.yml'
  pull_request:
    paths:
      - 'docs/site/**'
      - '.github/workflows/marketing-site.yml'

jobs:
  build-and-scan:
    name: Build + secret scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site (dormant — no PUBLIC_* env vars set)
        run: npm run build

      - name: Scan build output for secret token shapes
        run: bash scripts/check-build-no-secrets.sh dist
