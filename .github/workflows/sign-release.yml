name: Sign release — Sigstore + SLSA build provenance

# Supplemental signing workflow — the real gate lives in publish.yml
# where the PyPI upload is made to wait on signing.  This workflow
# also fires on release:published so a GitHub-only release (no PyPI
# step) still gets Sigstore bundles + SLSA provenance.
#
# See policies/SIGNING.md for verification recipes.  All third-party actions
# are pinned to a commit SHA.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to sign (tag or SHA)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: sign-release-${{ github.event.release.tag_name || github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    name: Sigstore sign + SLSA attest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release tag
        # actions/checkout v7.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.inputs.ref || github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel + sdist
        run: cd kiln && python -m build --outdir ../dist/

      - name: Sign artifacts with Sigstore (keyless)
        # sigstore/gh-action-sigstore-python v3.5.0
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz
          release-signing-artifacts: false

      - name: Attest SLSA build provenance
        # actions/attest-build-provenance v1.4.4
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Collect signed assets
        run: |
          mkdir -p signed
          cp dist/*.whl signed/
          cp dist/*.tar.gz signed/
          cp dist/*.sigstore signed/ 2>/dev/null || true
          ls -la signed/

      - name: Upload signed artifacts to release
        if: github.event_name == 'release'
        # softprops/action-gh-release v3.0.2
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            signed/*.sigstore
          fail_on_unmatched_files: false

      - name: Upload signed artifacts as workflow artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-${{ github.event.release.tag_name || github.run_id }}
          path: signed/
          retention-days: 90
