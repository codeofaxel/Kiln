name: SBOM — CycloneDX + SPDX per release

# Supplemental SBOM workflow — the real gate lives in publish.yml
# where the PyPI upload is made to wait on SBOM + signing.  This
# workflow also runs on release:published so a GitHub-only release
# (no PyPI step) still gets an SBOM attached.  See policies/SIGNING.md for
# the verification recipe.
#
# All third-party actions are pinned to a commit SHA, not a tag
# — a compromised upstream push cannot silently run in our CI.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to SBOM (tag or SHA)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: sbom-${{ github.event.release.tag_name || github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Generate + attest SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release tag
        # actions/checkout v7.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.inputs.ref || github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build kiln wheel + sdist
        # The kiln/ subdir is the source root for kiln3d.
        run: cd kiln && python -m build --outdir ../dist/

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.18.1
          syft version

      # Resolve what a user ACTUALLY receives from `pip install kiln3d`.
      #
      # Two wrong sources were tried before this one.  Scanning dist/
      # yields nothing: syft catalogues installed packages by reading
      # .dist-info directories, and a built wheel is an unopened archive,
      # so every published SBOM listed zero dependencies.  Scanning
      # requirements-lock.txt fixes that but overshoots — the lock is a
      # full dev freeze (it is what CI installs), so it published pytest,
      # coverage, pytest-mock, responses and 7 more test-harness packages
      # as though they shipped inside the product.  A reviewer scanning
      # that gets vulnerability hits on code no user can reach.
      #
      # Installing the package with the lock as a CONSTRAINTS file gives
      # both properties at once: only runtime requirements are installed,
      # and each is pinned to the version this release was tested against.
      # Optional extras are deliberately excluded — they are not part of a
      # default install, and the wheel's own metadata declares them.
      - name: Resolve the runtime dependency set
        run: |
          python -m venv /tmp/sbom-rt
          /tmp/sbom-rt/bin/python -m pip install --quiet --upgrade pip
          /tmp/sbom-rt/bin/pip install --quiet ./kiln -c kiln/requirements-lock.txt
          # Drop the editable marker and kiln3d itself: the SBOM names the
          # product in its metadata, and a local file:// self-reference
          # would otherwise land in the component list.
          /tmp/sbom-rt/bin/pip freeze \
            | grep -v '^-e ' \
            | grep -viE '^kiln3d([=@[:space:]]|$)' \
            | sort > runtime-requirements.txt
          echo "runtime packages resolved: $(wc -l < runtime-requirements.txt)"

      # The ref reaches the shell through env, never through direct
      # ${{ }} interpolation into the run block — a tag name is
      # attacker-chosen text, and interpolating it would let a crafted
      # tag execute commands in this job.
      - name: Generate CycloneDX JSON SBOM
        env:
          RAW_REF: ${{ github.event.release.tag_name || github.event.inputs.ref }}
        run: |
          VERSION="${RAW_REF#v}"
          syft file:runtime-requirements.txt \
            --output cyclonedx-json=sbom.cdx.json \
            --source-name kiln3d \
            --source-version "${VERSION:-dev}"

      - name: Generate SPDX JSON SBOM
        env:
          RAW_REF: ${{ github.event.release.tag_name || github.event.inputs.ref }}
        run: |
          VERSION="${RAW_REF#v}"
          syft file:runtime-requirements.txt \
            --output spdx-json=sbom.spdx.json \
            --source-name kiln3d \
            --source-version "${VERSION:-dev}"

      # An SBOM that lists nothing is worse than no SBOM: a scanner
      # ingesting it reports a clean bill of health for a package whose
      # dependencies it never saw.  Fail loudly instead of uploading one.
      - name: Verify the SBOMs actually list dependencies
        run: |
          python3 - <<'PY'
          import json, sys
          cdx = json.load(open('sbom.cdx.json')).get('components', [])
          spdx = json.load(open('sbom.spdx.json')).get('packages', [])
          print(f"CycloneDX components: {len(cdx)} | SPDX packages: {len(spdx)}")
          if len(cdx) < 10 or len(spdx) < 10:
              sys.exit(
                  "SBOM is empty or near-empty — refusing to publish a bill "
                  "of materials that lists no dependencies. Check the syft "
                  "scan target."
              )
          PY

      - name: Attest CycloneDX SBOM
        # actions/attest-sbom v2.2.0
        uses: actions/attest-sbom@115c3be05ff3974bcbd596578934b3f9ce39bf68
        with:
          subject-path: 'dist/*'
          sbom-path: sbom.cdx.json

      # A manual run with a `ref` uploads too, so a released SBOM can be
      # REPAIRED in place: the recovery path the release runbook promises
      # ("re-run it against the tag, it re-uploads onto the existing
      # release, no version bump") was gated to release events only, so
      # it generated a correct pair and dropped it as a workflow
      # artifact nobody serves.  `tag_name` is explicit because a
      # dispatch runs from a branch, and softprops would otherwise target
      # that branch instead of the tag being repaired.
      - name: Upload SBOMs as release assets
        if: github.event_name == 'release' || github.event.inputs.ref != ''
        # softprops/action-gh-release v3.0.2
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.ref }}
          files: |
            sbom.cdx.json
            sbom.spdx.json
          fail_on_unmatched_files: true

      - name: Upload SBOMs as workflow artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-${{ github.event.release.tag_name || github.run_id }}
          path: |
            sbom.cdx.json
            sbom.spdx.json
          retention-days: 90
