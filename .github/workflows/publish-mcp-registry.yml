name: Publish MCP Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish-mcp-registry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate registry metadata
        run: |
          python -c "import json; d=json.load(open('server.json')); desc=d.get('description',''); assert len(desc) <= 100, f'server.json description is {len(desc)} chars, max is 100'"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Sync server.json version
        run: |
          jq --arg v "${{ inputs.version }}" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
