name: Publish to PyPI + MCP Registry + ClawHub

on:
  release:
    types: [published]

# Read-only by default.  Only the jobs that publish or sign ask for an OIDC
# token, in their own `permissions:` block, so the test and build jobs (which
# install packages fresh from PyPI) never hold one.
permissions:
  contents: read

jobs:
  # Run full test suite before publishing anything
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install kiln with dev deps
        run: pip install -e "./kiln[dev,bambu]"

      - name: Install octoprint-cli with dev deps
        run: pip install -e "./octoprint-cli[dev]"

      # Parallel and quiet, as ci.yml runs it: one at a time, with a line per
      # test, the 1.5.0 suite took two hours here against CI's 25 minutes.
      - name: Run kiln tests
        run: cd kiln && python -m pytest tests/ -q -n auto

      - name: Run octoprint-cli tests
        run: cd octoprint-cli && python -m pytest tests/ -v

  # Validate that the git tag matches pyproject.toml version
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate kiln version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Strip leading 'v' if present (e.g. v0.1.0 -> 0.1.0)
          TAG="${TAG#v}"
          KILN_VERSION=$(python -c "
          import configparser, pathlib
          p = pathlib.Path('kiln/pyproject.toml').read_text()
          for line in p.splitlines():
              if line.strip().startswith('version'):
                  print(line.split('=')[1].strip().strip('\"'))
                  break
          ")
          echo "Git tag: $TAG"
          echo "kiln pyproject.toml version: $KILN_VERSION"
          if [ "$TAG" != "$KILN_VERSION" ]; then
            echo "::error::Version mismatch! Tag '$TAG' != pyproject.toml '$KILN_VERSION'"
            exit 1
          fi

  # The Mac notification helper, compiled on a Mac from the source at this
  # commit and attested (notifier.yml).  The repository never tracks it, so
  # this build is the only one the package can carry.
  build-notifier:
    needs: validate-version
    permissions:
      contents: read
      id-token: write          # sign the attestation
      attestations: write      # store it
    uses: ./.github/workflows/notifier.yml

  build-kiln:
    needs: [test, validate-version, build-notifier]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read       # gh attestation verify

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Download the Mac notification helper
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kiln-notifier-app
          path: notifier-build/

      # Into the package tree, where package-data picks it up, and only if it
      # is byte for byte the executable the Mac build reported.
      - name: Put the helper in the package
        env:
          EXPECTED: ${{ needs.build-notifier.outputs.sha256 }}
        run: |
          tar -C kiln/src/kiln/data/notifier -xf notifier-build/kiln-notifier-app.tar
          GOT="$(sha256sum kiln/src/kiln/data/notifier/Kiln.app/Contents/MacOS/kiln-notifier | cut -d' ' -f1)"
          echo "built:    $EXPECTED"
          echo "unpacked: $GOT"
          if [ -z "$EXPECTED" ] || [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::the unpacked helper is not the one the Mac build produced"
            exit 1
          fi

      - name: Install build tools
        run: pip install build

      - name: Build kiln package
        run: cd kiln && python -m build

      # Wheel-inventory gate.  Catches the "package-data glob silently
      # drops a subdirectory" bug class — v0.3.3 shipped `data/*.json`
      # (non-recursive) for 3+ years and dropped design_knowledge/,
      # BOSL2/, MCAD/, and the A1 g-code wrappers from every PyPI
      # release.  This gate exits 2 if the just-built wheel is missing
      # any file the runtime depends on, blocking the upload before
      # SBOM / signing / PyPI publish.  Audits the exact wheel that
      # will be uploaded (--wheel), not a rebuild — gating on the
      # signed artifact, not a maybe-different binary.  Same family as
      # the kiln-pro audit_rls.py and check_doc_counts.py release gates.
      # --release: this is the wheel going to PyPI, so the compiled Mac
      # helper must be in it too.
      - name: Verify wheel inventory
        run: |
          WHEEL=$(ls kiln/dist/*.whl | head -1)
          if [ -z "$WHEEL" ]; then
            echo "::error::No wheel found in kiln/dist/ — did the build step run?"
            exit 1
          fi
          python3 scripts/audit_wheel_inventory.py --wheel "$WHEEL" --release

      # The check anyone can run on an installed copy, run on the wheel before
      # it is signed or uploaded: its Mac helper verifies against this
      # repository and this release's commit.
      - name: Verify the wheel's Mac helper against its attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- kiln/dist/*.whl
          unzip -p "$1" kiln/data/notifier/Kiln.app/Contents/MacOS/kiln-notifier > "$RUNNER_TEMP/kiln-notifier"
          gh attestation verify "$RUNNER_TEMP/kiln-notifier" --repo "$GITHUB_REPOSITORY" --source-digest "$GITHUB_SHA"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-kiln
          path: kiln/dist/

  # Gate PyPI upload on supply-chain artifacts.  If SBOM or signing
  # fails, the wheel never goes to PyPI — better to ship nothing than
  # ship unverified.  Enterprise procurement requires these.  See
  # policies/SIGNING.md for the full verification recipe.
  supply-chain-kiln:
    needs: build-kiln
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # sigstore OIDC + attestations
      contents: write          # upload assets to the release
      attestations: write      # actions/attest-*

    steps:
      - name: Checkout code
        # actions/checkout v7.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download built artifacts
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist-kiln
          path: dist/

      # SBOMs are NOT generated here.  `sbom.yml` owns them end to end —
      # it resolves the real runtime dependency set, scans it, refuses to
      # publish an empty bill of materials, attests it, and uploads it.
      #
      # This job used to generate its own pair with `syft dir:dist` and
      # upload them to the same release under the same filenames.  Both
      # workflows fire on `release: published`, so the two uploads raced
      # and the later one won.  `dir:dist` scans an unopened wheel, which
      # syft catalogues as nothing, so the empty pair overwrote the real
      # one roughly ten minutes after it landed — and the guard that would
      # have caught it lives in the OTHER workflow, which had already
      # passed on its own correct file.  Measured on v1.3.1: sbom.yml
      # produced 46 components at 17:36; the asset served at 17:46 had 0.
      #
      # One artifact, one owner.  If SBOM coverage ever needs to block a
      # publish, depend on sbom.yml rather than re-deriving it here.
      - name: Sign wheel + sdist with Sigstore (keyless)
        # sigstore/gh-action-sigstore-python v3.5.0
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz
          release-signing-artifacts: true

      - name: Attest SLSA build provenance
        # actions/attest-build-provenance v1.4.4
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      # Only the signing artifacts this job actually produces.  The SBOM
      # filenames are deliberately absent: they belong to sbom.yml, and
      # listing them here is what let an empty pair overwrite a good one.
      - name: Upload signing artifacts to the GitHub release
        # softprops/action-gh-release v3.0.2
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          files: |
            dist/*.sigstore
          fail_on_unmatched_files: false

  publish-kiln:
    needs: supply-chain-kiln
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download kiln artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-kiln
          path: dist/

      - name: Publish kiln3d to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          # A duplicate upload must not cascade.  publish-mcp-registry and
          # publish-clawhub both `needs: publish-kiln`, so PyPI's 400 "file
          # already exists" — what a manual publish or a resumed partial run
          # produces — failed this job and SKIPPED both registries, leaving
          # the release announced on PyPI and nowhere else (1.3.0 shipped
          # that way on 2026-07-29).  The version itself is still guarded:
          # validate-version refuses a tag that does not match the package.
          # Every sibling package here already sets this; the one that
          # cascades was the one that did not.
          skip-existing: true

  build-octoprint-cli:
    needs: [test, validate-version]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build octoprint-cli package
        run: cd octoprint-cli && python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-octoprint-cli
          path: octoprint-cli/dist/

  publish-octoprint-cli:
    needs: build-octoprint-cli
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download octoprint-cli artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-octoprint-cli
          path: dist/

      - name: Publish kiln3d-octoprint to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true

  # Publish redirect packages (kiln-print, kiln-printer) that point to kiln3d
  build-redirects:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build kiln-print
        run: cd redirects/kiln-print && python -m build

      - name: Build kiln-printer
        run: cd redirects/kiln-printer && python -m build

      - name: Upload kiln-print artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-kiln-print
          path: redirects/kiln-print/dist/

      - name: Upload kiln-printer artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-kiln-printer
          path: redirects/kiln-printer/dist/

  publish-kiln-print:
    needs: [build-redirects, publish-kiln]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download kiln-print artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-kiln-print
          path: dist/

      - name: Publish kiln-print to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true

  publish-kiln-printer:
    needs: [build-redirects, publish-kiln]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download kiln-printer artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-kiln-printer
          path: dist/

      - name: Publish kiln-printer to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true

  # Publish to the official MCP Registry after PyPI is live
  publish-mcp-registry:
    needs: publish-kiln
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install mcp-publisher
        # A fixed release, checked against the digest GitHub reports for the
        # asset, so the publisher that runs with the OIDC token is the one
        # that was reviewed.  Bump both values together.
        env:
          MCP_PUBLISHER_VERSION: v1.8.7
          MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Sync server.json version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

  # Publish to ClawHub (OpenClaw skill registry) after PyPI is live
  publish-clawhub:
    needs: publish-kiln
    runs-on: ubuntu-latest
    # A repository secret and an npm tool: no OIDC token in this job.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install ClawHub CLI
        run: npm install -g clawhub@0.25.1

      - name: Log in to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: clawhub login --token "$CLAWHUB_TOKEN" --no-browser

      - name: Prepare minimal publish folder
        run: |
          mkdir -p /tmp/kiln-clawhub
          cp SKILL.md server.json README.md LICENSE /tmp/kiln-clawhub/

      - name: Publish to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          clawhub publish /tmp/kiln-clawhub \
            --slug kiln \
            --name "Kiln" \
            --version "$VERSION" \
            --changelog "v${VERSION} — see https://github.com/codeofaxel/Kiln/releases/tag/${GITHUB_REF#refs/tags/}" \
            --tags "latest,3d-printing,mcp,ai-agent,bambu,moonraker,octoprint,prusa,klipper,elegoo"

  # After every PyPI publish job completes, override the
  # `pypa/gh-action-pypi-publish` action's automatic "inactive" status
  # so the repo's Deployments widget shows green ✓ on the `pypi` row
  # instead of greyed-out "inactive".  The action fires its own
  # success → inactive sequence within ~7 seconds as a one-shot-deploy
  # convention; we post a fresh success last so the widget reflects
  # what actually happened (the publish succeeded).
  finalize-pypi-status:
    needs: [publish-kiln, publish-octoprint-cli, publish-kiln-print, publish-kiln-printer]
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Override pypi deployment status to success
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          DEP_ID=$(gh api "repos/$REPO/deployments?environment=pypi&per_page=1" --jq '.[0].id')
          if [ -z "$DEP_ID" ]; then
            echo "No pypi deployment found; skipping status override."
            exit 0
          fi
          gh api "repos/$REPO/deployments/$DEP_ID/statuses" -X POST \
            -f state=success \
            -f environment=pypi \
            -f description="kiln3d ${TAG} published to PyPI"
