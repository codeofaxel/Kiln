name: Publish to PyPI + MCP Registry + ClawHub

on:
  release:
    types: [published]

permissions:
  id-token: write  # Required for trusted publishing + MCP Registry OIDC
  contents: read

jobs:
  # Run full test suite before publishing anything
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install kiln with dev deps
        run: pip install -e "./kiln[dev,bambu]"

      - name: Install octoprint-cli with dev deps
        run: pip install -e "./octoprint-cli[dev]"

      - name: Run kiln tests
        run: cd kiln && python -m pytest tests/ -v

      - name: Run octoprint-cli tests
        run: cd octoprint-cli && python -m pytest tests/ -v

  # Validate that the git tag matches pyproject.toml version
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate kiln version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Strip leading 'v' if present (e.g. v0.1.0 -> 0.1.0)
          TAG="${TAG#v}"
          KILN_VERSION=$(python -c "
          import configparser, pathlib
          p = pathlib.Path('kiln/pyproject.toml').read_text()
          for line in p.splitlines():
              if line.strip().startswith('version'):
                  print(line.split('=')[1].strip().strip('\"'))
                  break
          ")
          echo "Git tag: $TAG"
          echo "kiln pyproject.toml version: $KILN_VERSION"
          if [ "$TAG" != "$KILN_VERSION" ]; then
            echo "::error::Version mismatch! Tag '$TAG' != pyproject.toml '$KILN_VERSION'"
            exit 1
          fi

  build-kiln:
    needs: [test, validate-version]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build kiln package
        run: cd kiln && python -m build

      # Wheel-inventory gate.  Catches the "package-data glob silently
      # drops a subdirectory" bug class — v0.3.3 shipped `data/*.json`
      # (non-recursive) for 3+ years and dropped design_knowledge/,
      # BOSL2/, MCAD/, and the A1 g-code wrappers from every PyPI
      # release.  This gate exits 2 if the just-built wheel is missing
      # any file the runtime depends on, blocking the upload before
      # SBOM / signing / PyPI publish.  Audits the exact wheel that
      # will be uploaded (--wheel), not a rebuild — gating on the
      # signed artifact, not a maybe-different binary.  Same family as
      # the kiln-pro audit_rls.py and check_doc_counts.py release gates.
      - name: Verify wheel inventory
        run: |
          WHEEL=$(ls kiln/dist/*.whl | head -1)
          if [ -z "$WHEEL" ]; then
            echo "::error::No wheel found in kiln/dist/ — did the build step run?"
            exit 1
          fi
          python3 scripts/audit_wheel_inventory.py --wheel "$WHEEL"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-kiln
          path: kiln/dist/

  # Gate PyPI upload on supply-chain artifacts.  If SBOM or signing
  # fails, the wheel never goes to PyPI — better to ship nothing than
  # ship unverified.  Enterprise procurement requires these.  See
  # policies/SIGNING.md for the full verification recipe.
  supply-chain-kiln:
    needs: build-kiln
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # sigstore OIDC + attestations
      contents: write          # upload assets to the release
      attestations: write      # actions/attest-*

    steps:
      - name: Checkout code
        # actions/checkout v6.0.2
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Download built artifacts
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist-kiln
          path: dist/

      - name: Install syft
        # Anchore syft — pinned by version tag; binary self-verified
        # via checksum in the installer script.
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.18.1
          syft version

      - name: Generate CycloneDX JSON SBOM
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          syft dir:dist \
            --output cyclonedx-json=sbom.cdx.json \
            --source-name kiln3d \
            --source-version "${VERSION:-dev}"

      - name: Generate SPDX JSON SBOM
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          syft dir:dist \
            --output spdx-json=sbom.spdx.json \
            --source-name kiln3d \
            --source-version "${VERSION:-dev}"

      - name: Attest CycloneDX SBOM
        # actions/attest-sbom v1.4.3
        uses: actions/attest-sbom@115c3be05ff3974bcbd596578934b3f9ce39bf68
        with:
          subject-path: 'dist/*'
          sbom-path: sbom.cdx.json

      - name: Sign wheel + sdist with Sigstore (keyless)
        # sigstore/gh-action-sigstore-python v3.0.0
        uses: sigstore/gh-action-sigstore-python@f7ad0af51a5648d09a20d00370f0a91c3bdf8f84
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz
          release-signing-artifacts: true

      - name: Attest SLSA build provenance
        # actions/attest-build-provenance v1.4.4
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload SBOMs to the GitHub release
        # softprops/action-gh-release v2.2.1
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            sbom.cdx.json
            sbom.spdx.json
            dist/*.sigstore
          fail_on_unmatched_files: false

      - name: Upload SBOMs as workflow artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-kiln-${{ github.event.release.tag_name || github.run_id }}
          path: |
            sbom.cdx.json
            sbom.spdx.json
          retention-days: 90

  publish-kiln:
    needs: supply-chain-kiln
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download kiln artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-kiln
          path: dist/

      - name: Publish kiln3d to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build-octoprint-cli:
    needs: [test, validate-version]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build octoprint-cli package
        run: cd octoprint-cli && python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-octoprint-cli
          path: octoprint-cli/dist/

  publish-octoprint-cli:
    needs: build-octoprint-cli
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download octoprint-cli artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-octoprint-cli
          path: dist/

      - name: Publish kiln3d-octoprint to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # Publish redirect packages (kiln-print, kiln-printer) that point to kiln3d
  build-redirects:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build kiln-print
        run: cd redirects/kiln-print && python -m build

      - name: Build kiln-printer
        run: cd redirects/kiln-printer && python -m build

      - name: Upload kiln-print artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-kiln-print
          path: redirects/kiln-print/dist/

      - name: Upload kiln-printer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-kiln-printer
          path: redirects/kiln-printer/dist/

  publish-kiln-print:
    needs: [build-redirects, publish-kiln]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download kiln-print artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-kiln-print
          path: dist/

      - name: Publish kiln-print to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-kiln-printer:
    needs: [build-redirects, publish-kiln]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download kiln-printer artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-kiln-printer
          path: dist/

      - name: Publish kiln-printer to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # Publish to the official MCP Registry after PyPI is live
  publish-mcp-registry:
    needs: publish-kiln
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Sync server.json version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

  # Publish to ClawHub (OpenClaw skill registry) after PyPI is live
  publish-clawhub:
    needs: publish-kiln
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Log in to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: clawhub login --token "$CLAWHUB_TOKEN" --no-browser

      - name: Prepare minimal publish folder
        run: |
          mkdir -p /tmp/kiln-clawhub
          cp SKILL.md server.json README.md LICENSE /tmp/kiln-clawhub/

      - name: Publish to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          clawhub publish /tmp/kiln-clawhub \
            --slug kiln \
            --name "Kiln" \
            --version "$VERSION" \
            --changelog "v${VERSION} — see https://github.com/codeofaxel/Kiln/releases/tag/${GITHUB_REF#refs/tags/}" \
            --tags "latest,3d-printing,mcp,ai-agent,bambu,moonraker,octoprint,prusa,klipper,elegoo"

  # After every PyPI publish job completes, override the
  # `pypa/gh-action-pypi-publish` action's automatic "inactive" status
  # so the repo's Deployments widget shows green ✓ on the `pypi` row
  # instead of greyed-out "inactive".  The action fires its own
  # success → inactive sequence within ~7 seconds as a one-shot-deploy
  # convention; we post a fresh success last so the widget reflects
  # what actually happened (the publish succeeded).
  finalize-pypi-status:
    needs: [publish-kiln, publish-octoprint-cli, publish-kiln-print, publish-kiln-printer]
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Override pypi deployment status to success
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          DEP_ID=$(gh api "repos/$REPO/deployments?environment=pypi&per_page=1" --jq '.[0].id')
          if [ -z "$DEP_ID" ]; then
            echo "No pypi deployment found; skipping status override."
            exit 0
          fi
          gh api "repos/$REPO/deployments/$DEP_ID/statuses" -X POST \
            -f state=success \
            -f environment=pypi \
            -f description="kiln3d ${TAG} published to PyPI"
