<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-width="1"/>
    </pattern>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <symbol id="printer" viewBox="0 0 80 64">
      <rect x="2" y="52" width="76" height="7" rx="2" fill="currentColor" opacity="0.55"/>
      <rect x="14" y="16" width="52" height="36" rx="4" fill="#15151f" stroke="#34344a" stroke-width="1.2"/>
      <rect x="10" y="8" width="5" height="46" rx="2" fill="currentColor" opacity="0.7"/>
      <rect x="10" y="8" width="38" height="5" rx="2" fill="currentColor" opacity="0.7"/>
      <rect x="43" y="11" width="7" height="11" rx="1.5" fill="currentColor" opacity="0.95"/>
      <line x1="46.5" y1="22" x2="46.5" y2="34" stroke="currentColor" stroke-width="2" stroke-dasharray="3,2" opacity="0.6"/>
      <rect x="18" y="46" width="44" height="5" rx="1.5" fill="#26263a"/>
      <rect x="34" y="38" width="16" height="8" rx="1" fill="currentColor" opacity="0.25"/>
      <rect x="36" y="32" width="12" height="7" rx="1" fill="currentColor" opacity="0.16"/>
    </symbol>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.04"/>
  <ellipse cx="600" cy="330" rx="520" ry="200" fill="#ff6b2b" opacity="0.03"/>

  <!-- Title -->
  <text x="600" y="128" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" letter-spacing="-1">Kiln supports the Bambu <tspan fill="#ff6b2b">A2L</tspan></text>

  <!-- Subtitle -->
  <text x="600" y="176" text-anchor="middle" fill="#9a9aa8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="400">3 days after the June 1 launch &#183; plus three more new Bambu printers</text>

  <!-- ── Printer cards ─────────────────────────────── -->

  <!-- A2L (hero) -->
  <g>
    <rect x="60" y="250" width="250" height="168" rx="14" fill="#111118" stroke="#ff6b2b" stroke-width="1.5"/>
    <rect x="60" y="250" width="250" height="168" rx="14" fill="none" stroke="#ff6b2b" stroke-width="1" opacity="0.25" filter="url(#softGlow)"/>
    <use href="#printer" x="145" y="266" width="80" height="64" color="#ff6b2b"/>
    <text x="185" y="362" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700">A2L</text>
    <rect x="107" y="380" width="156" height="26" rx="13" fill="#ff6b2b" opacity="0.14"/>
    <rect x="107" y="380" width="156" height="26" rx="13" fill="none" stroke="#ff6b2b" stroke-width="1" opacity="0.5"/>
    <text x="185" y="397" text-anchor="middle" fill="#ff8a4c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1">3 DAYS AFTER LAUNCH</text>
  </g>

  <!-- X1E -->
  <g>
    <rect x="337" y="250" width="250" height="168" rx="14" fill="#111118" stroke="#2a2a3a" stroke-width="1.5"/>
    <use href="#printer" x="422" y="266" width="80" height="64" color="#7a7a92"/>
    <text x="462" y="362" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700">X1E</text>
    <text x="462" y="395" text-anchor="middle" fill="#5f5f70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1">NEW IN 1.1.7</text>
  </g>

  <!-- P2S -->
  <g>
    <rect x="614" y="250" width="250" height="168" rx="14" fill="#111118" stroke="#2a2a3a" stroke-width="1.5"/>
    <use href="#printer" x="699" y="266" width="80" height="64" color="#7a7a92"/>
    <text x="739" y="362" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700">P2S</text>
    <text x="739" y="395" text-anchor="middle" fill="#5f5f70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1">NEW IN 1.1.7</text>
  </g>

  <!-- H2S -->
  <g>
    <rect x="891" y="250" width="250" height="168" rx="14" fill="#111118" stroke="#2a2a3a" stroke-width="1.5"/>
    <use href="#printer" x="976" y="266" width="80" height="64" color="#7a7a92"/>
    <text x="1016" y="362" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700">H2S</text>
    <text x="1016" y="395" text-anchor="middle" fill="#5f5f70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1">NEW IN 1.1.7</text>
  </g>

  <!-- ── Stat row ──────────────────────────────────── -->
  <line x1="80" y1="472" x2="1120" y2="472" stroke="#1a1a2a" stroke-width="1"/>

  <text x="240" y="522" text-anchor="middle" fill="#ff6b2b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700">4</text>
  <text x="240" y="545" text-anchor="middle" fill="#555566" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="0.5">NEW PRINTERS</text>

  <text x="480" y="522" text-anchor="middle" fill="#ff6b2b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700">3</text>
  <text x="480" y="545" text-anchor="middle" fill="#555566" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="0.5">DAYS TO A2L SUPPORT</text>

  <text x="720" y="522" text-anchor="middle" fill="#ff6b2b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700">FREE</text>
  <text x="720" y="545" text-anchor="middle" fill="#555566" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="0.5">FOR EVERYONE</text>

  <text x="960" y="521" text-anchor="middle" fill="#ff6b2b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700">AGPL-3.0</text>
  <text x="960" y="545" text-anchor="middle" fill="#555566" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="0.5">OPEN SOURCE</text>

  <!-- Branding -->
  <text x="1140" y="602" text-anchor="end" fill="#333344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">kiln3d.com</text>
</svg>
