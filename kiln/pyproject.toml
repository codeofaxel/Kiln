[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiln3d"
version = "1.3.0"
description = "MCP server + CLI that gives AI agents safe access to 3D printers (Bambu Lab, Creality, Prusa Link, Elegoo, Moonraker/Klipper, OctoPrint, Duet, USB) — 887 MCP capabilities for AI-driven print workflows"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "Kiln Contributors"},
]
keywords = [
    "3d-printing", "mcp", "mcp-server", "model-context-protocol",
    "ai-agent", "agent", "llm", "automation",
    "fabrication", "manufacturing", "print-farm",
    "octoprint", "moonraker", "klipper", "bambu", "bambu-lab", "prusa", "prusa-link", "elegoo",
    "gcode", "slicer", "prusaslicer", "orcaslicer",
    "iot", "smart-manufacturing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
    "Topic :: Scientific/Engineering",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
]
dependencies = [
    # Deliberately NOT upper-bounded.  SDK 2.0 (2026-07-28) is the spec the
    # hosted /mcp connector serves, and Dockerfile.api pins `mcp>=2.0` for
    # exactly that reason, so a `<2` here would declare kiln3d incompatible
    # with the SDK its own hosted deploy requires.  `kiln.mcp_compat` is how
    # both majors are supported instead — see the port still owed there.
    "mcp>=1.0",
    "requests>=2.25",
    "pyyaml>=5.4",
    "pydantic>=2.0",
    "click>=8.0",
    "zeroconf>=0.80",
    "rich>=12.0",
    "paho-mqtt>=2.0",
    "cryptography>=41.0",
    # websockets powers the web->printer bridge's dial-out client
    # (``kiln.bridge_client``) — a core dep, not an extra, so the
    # documented `kiln bridge enable` works on a fresh install instead
    # of erroring with "install websockets first".
    "websockets>=12.0",
    # numpy powers the ray-cast wall-thickness measurement in
    # ``kiln.printability._analyze_thin_walls`` — promoted from the
    # ``mesh-diagnostics`` extra so every install measures walls
    # correctly out of the box rather than falling back to the prior
    # tessellation-dependent edge-length proxy.  ~25 MB on disk;
    # bounded cost for a correct verdict.
    "numpy>=1.24",
]

[project.optional-dependencies]
bambu = []  # Bambu support is now included by default
elegoo = ["websocket-client>=1.9.0"]
postgres = ["psycopg2-binary>=2.9.12"]
# NOTE: `kiln3d[rest]` used to pull `kiln-pro[rest]`, but kiln-pro is a
# private package and the extra would fail on every public `pip install`.
# The REST API ships in kiln-pro itself; install it directly from the
# private repo (see kiln3d.com/docs) — don't promise it here.
stripe = ["stripe>=15.3.0"]
payments = ["stripe>=15.3.0", "cryptography>=41.0"]
# The backend is named `usb`; `serial` stays as an alias so the install
# line in older docs keeps working.
usb = ["pyserial>=3.5"]
serial = ["pyserial>=3.5"]
qr = ["qrcode[pil]>=8.2"]
emboss = ["Pillow>=9.0", "rembg>=2.0.69", "onnxruntime>=1.24.3"]
mesh-diagnostics = ["trimesh>=4.0", "numpy>=1.24"]
# STEP/STP import.  The VTK-free OCCT kernel — measured on disk 2026-07-27:
# `cadquery` 1163 MB, `cadquery-ocp` 848 MB (it hard-requires vtk==9.6.2 and
# won't even import without it), `cadquery-ocp-novtk` 228 MB.  Everything
# past the kernel serves visualization and solver features STEP conversion
# never calls.  An extra rather than a core dependency because most users
# never open a STEP file; `kiln install-step-backend` installs it for the
# ones who do.  Anyone who already has full cadquery keeps working — the OCP
# backend uses whichever build provides the `OCP` module.
step = ["cadquery-ocp-novtk>=7.9"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.6",
    "responses>=0.20",
    "Pillow>=9.0",
]

[project.scripts]
kiln = "kiln.cli.main:main"
kiln3d = "kiln.cli.main:main"

[project.urls]
Homepage = "https://kiln3d.com/?utm_source=pypi&utm_medium=package-page"
Documentation = "https://kiln3d.com/docs?utm_source=pypi&utm_medium=package-page"
Repository = "https://github.com/codeofaxel/Kiln"
Issues = "https://github.com/codeofaxel/Kiln/issues"
Changelog = "https://github.com/codeofaxel/Kiln/releases"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Vendored third-party SCAD libraries (MCAD, BOSL2, etc.) contain their
# own pytest hooks using pre-8.x API; they are not our tests and must
# not be collected.
norecursedirs = ["src/kiln/data"]
markers = [
    "live: requires a real OctoPrint instance (deselect with '-m \"not live\"')",
    "slow: opt-in regression sweep (deselect with '-m \"not slow\"', include with '-m slow')",
    "use_real_openscad_probe: opt out of the conftest probe stub so the real _probe_openscad_runs runs against a mocked subprocess",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["src/kiln/data/scad_libraries/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long — handled by formatter
    "SIM108", # ternary — readability preference
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the kiln/data tree completely so pip-installed users get the same
# files the source tree carries: design-knowledge catalogs (read by
# design_intelligence.py / printability.py / assembly.py), BOSL2 +
# MCAD OpenSCAD libraries (resolved at runtime when generated SCAD uses
# `include <BOSL2/...>` or `<MCAD/...>`), Bambu A1 g-code wrappers
# (read by printers/bambu_3mf.py), and third-party LICENSE files
# (legal compliance — BOSL2 BSD-2-Clause, MCAD LGPL-2.1).
#
# Why the recursive globs: prior `data/*.json` was non-recursive and
# silently dropped data/design_knowledge/**, data/scad_libraries/BOSL2/**,
# data/scad_libraries/MCAD/**, and the A1 .gcode wrappers from every
# PyPI wheel since v0.3.3.  Runtime code at `_DATA_DIR / "<...>"` gates on
# `path.exists()` so most callers got silently-degraded fallbacks instead
# of crashes; A1 connectivity hit a hard exception because bambu_3mf.py
# raises when the gcode file is missing.  Audit caught it 2026-05-19.
#
# When adding a new data file type under kiln/data/, extend this list
# rather than relying on the default-include behavior — `package-data`
# is the source of truth for what reaches a pip-installed user's disk.
kiln = [
    "data/*.json",
    "data/*.gcode",
    "data/design_knowledge/*.json",
    "data/scad_libraries/BOSL2/*.scad",
    "data/scad_libraries/BOSL2/LICENSE",
    "data/scad_libraries/MCAD/*.scad",
    "py.typed",
    "generation/scad_library/*.scad",
]
