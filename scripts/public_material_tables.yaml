# Per-material tables in the public package, and why each is there.
# Enforced by scripts/audit_public_material_tables.py.
#
# keep:      stays public; names the offline door that needs it.
# baseline:  present when the gate was added; listed, not judged.  The list
#            only shrinks: a table leaves it when it is served instead, or
#            when it earns a keep row.  A new table may not join it.
baseline_count: 22
keep:
  'gcode.py::_MATERIAL_TEMPS':
    door: the live-printer filament load, unload, purge and wipe commands
    why: with no server they must refuse a nozzle temperature outside the material's range
  'catalog_keys.py::_MATERIAL_ABBREVIATIONS':
    door: every material lookup
    why: a spelling map from short names to catalogue ids; it carries no figure or judgement
  'data/design_knowledge/finishing_cautions.json::(top)':
    door: the finishing guide (get_post_processing_guide) when Kiln's servers cannot be reached or the install is signed out
    why: it must still say the fire, fume, dust and skin warnings of each finish a plastic takes; it carries the finish names and those warnings only
  'material_safety.py::_REFUSED_PAIRS':
    door: the multi-colour composer and the print doors that load several materials into one print
    why: with no server they must still refuse loading two plastics whose nozzle temperatures cannot share one print, a clog and failed-print floor
baseline:
  - 'ambient_safety.py::_ALIASES'
  - 'ambient_safety.py::_MATERIAL_THERMAL_PROFILES'
  - 'cli/main.py::_MATERIAL_ALIASES'
  - 'cli/main.py::_MATERIAL_TEMPS'
  - 'cost_estimator.py::BUILTIN_MATERIALS'
  - 'data/design_knowledge/environment_compatibility.json::(top)'
  - 'data/design_knowledge/load_tables.json::(top)'
  - 'data/design_knowledge/material_troubleshooting.json::(top)'
  - 'data/design_knowledge/materials.json::(top)'
  - 'data/design_knowledge/printer_material_compatibility.json::default'
  - 'data/design_knowledge/skin_contact.json::(top)'
  - 'data/printer_intelligence.json::default.materials'
  - 'data/support_profiles.json::(top)'
  - 'design_reasoning.py::_MATERIAL_DEFAULTS'
  - 'emboss_generator.py::MATERIAL_DEPTHS'
  - 'materials.py::MATERIAL_TEMPS'
  - 'materials.py::_MATERIAL_ALIASES'
  - 'printability.py::_UNVOUCHED_ON_A_STANDARD_BED'
  - 'printers/bambu_3mf.py::_TABLE_ROW_TO_BAMBU'
  - 'server.py::mat_aliases'
  - 'server.py::mat_type_map'
  - 'support_assessment.py::MATERIAL_ALIASES'

# Public tools that return a material's whole record, or most of a table, when
# asked about a material.  Checked by kiln/tests/test_no_whole_material_record_leaves.py.
# keep: stays, with a reason.  baseline: present when the check was added;
# listed, not judged; it only shrinks and a new tool may not join it.
whole_record_doors:
  baseline_count: 2
  keep: {}
  baseline:
    - 'get_material_design_profile::data/design_knowledge/materials.json::(top)'
    - 'get_material_properties::data/design_knowledge/materials.json::(top)'
